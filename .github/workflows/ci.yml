name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the old run; runs on main all finish, so every merge is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Format, test, validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The database tests start PostgreSQL in Docker. Here they must run, never skip.
      QUIZTIME_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify
        run: tools/verify

  checks:
    name: Run checks, check links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Set on PRs only: there just the changed questions run. On main and manual runs, all of them.
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      # The full history, so run-checks can find the merge base with the PR's base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # run-checks starts its own postgres:16.15 container, so CI runs the same server as local runs.
      - name: Run checks
        run: tools/run-checks ${BASE_SHA:+--changed-since "$BASE_SHA"}

      - name: Check links
        if: ${{ !cancelled() }}
        run: tools/check-links ${BASE_SHA:+--changed-since "$BASE_SHA"}

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
