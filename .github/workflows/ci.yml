name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the old run; runs on main all finish, so every merge is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Milestone 2 adds a `checks` job: PostgreSQL 16 service container, run-checks for
  # changed questions (all of them on main) and the link check. See docs/TESTING.md.
  # Finding changed questions needs the base commit: check out with `fetch-depth: 0`.
  verify:
    name: Format, test, validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify
        run: tools/verify

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
